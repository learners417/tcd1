<!doctype html>
<html lang="es" translate="no" data-theme="light">
  <head>
    <meta charset="UTF-8" />

    <meta name="google" content="notranslate" />
    <title>Tu Clínica Digital</title>
    <!--
      El color de la app es el crema del tema claro, que es el único que ve el
      cliente. Estaba en negro: la pantalla de arranque abría en negro para
      entrar a una app crema, y la barra de estado pintaba el reloj en blanco
      sobre ese mismo crema.

      Y la barra pasa de translúcida a normal: translúcida deja que el
      contenido suba hasta el borde físico, así que el encabezado quedaba
      debajo del reloj en la app instalada. En modo normal el sistema reserva
      ese alto y el reloj se lee en oscuro.
    -->
    <meta name="theme-color" content="#EAE4D9" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
