<title>Anuncios que Agendan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Una idea por pantalla: barra con pestañas grandes, una pantalla centrada, paginador fijo abajo. Papel claro, tinta, oro mate solo en líneas de 1px; rojo tacha, verde tilda, ámbar avisa. */
:root{
  --bg:#FAF9F6; --surface:#FFFFFF; --ink:#1F2328; --soft:#585E66; --line:#E4E0D6;
  --gold:#A48A55; --gold-ink:#7A6435;
  --pine:#22463F; --pine-ink:#FFFFFF; --pine-tint:#EAF1EE;
  --no:#B23A2B; --no-bg:#FBEEEB; --si:#2B6F4F; --si-bg:#E8F3EC; --amb:#8C5E0C; --amb-bg:#FAF0DA;
  --f-display:'Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181B; --surface:#1D2125; --ink:#ECEAE4; --soft:#A7ABB0; --line:#30353A;
    --gold:#C2A66C; --gold-ink:#CDB27A;
    --pine:#86C7B3; --pine-ink:#0E1E1A; --pine-tint:#1C2D29;
    --no:#F2907F; --no-bg:#3A2320; --si:#82D3A8; --si-bg:#1B3127; --amb:#E8B95E; --amb-bg:#3A2F18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15181B; --surface:#1D2125; --ink:#ECEAE4; --soft:#A7ABB0; --line:#30353A;
  --gold:#C2A66C; --gold-ink:#CDB27A;
  --pine:#86C7B3; --pine-ink:#0E1E1A; --pine-tint:#1C2D29;
  --no:#F2907F; --no-bg:#3A2320; --si:#82D3A8; --si-bg:#1B3127; --amb:#E8B95E; --amb-bg:#3A2F18;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 18px/1.6 var(--f-body);padding-inline:16px;padding-block:0;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(32px,6vw,48px);font-weight:900}
h2{font-size:clamp(28px,5vw,40px);font-weight:900}
h3{font-size:22px;font-weight:800}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.soft{color:var(--soft)}
.eyebrow{font:800 15px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--gold)}
.bar-in{max-width:900px;margin-inline:auto;display:flex;flex-direction:column;gap:2px;padding-block:12px 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand b{font:900 21px var(--f-display);display:flex;align-items:center;gap:10px}
.mark{width:22px;height:22px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center}
.mark i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.saved{font-size:15px;color:var(--soft)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px 10px;white-space:nowrap;font:800 17px var(--f-display);color:var(--soft);cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.wrap{max-width:900px;margin-inline:auto;padding-block:32px 150px}
.screen{display:flex;flex-direction:column;gap:28px}
.screen.enter{animation:in .35s ease both}
@keyframes in{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen.enter{animation:none}}
.lead{font-size:21px;line-height:1.5;max-width:58ch;color:var(--soft)}
.big{font:800 clamp(23px,4vw,30px)/1.3 var(--f-display);text-wrap:balance}
.rule{height:1px;background:var(--gold);border:0;margin:0;width:56px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:12px 22px;font:800 17px var(--f-display);cursor:pointer;min-height:48px}
.btn:hover{border-color:var(--gold)}
.btn.main{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.btn.main:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;text-decoration:underline;text-underline-offset:4px;padding-inline:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap}

.chip{display:inline-flex;align-items:center;gap:6px;font:800 15px var(--f-display);padding:4px 14px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;background:none}
.chip.si{background:var(--si-bg);color:var(--si);border-color:transparent}
.chip.no{background:var(--no-bg);color:var(--no);border-color:transparent}
.chip.amb{background:var(--amb-bg);color:var(--amb);border-color:transparent}
.chip.gold{border-color:var(--gold);color:var(--gold-ink)}

.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.ex{border-radius:var(--r);padding:22px 22px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ex.no{background:var(--no-bg)} .ex.si{background:var(--si-bg)}
.ex .tag{display:flex;align-items:center;gap:10px;font:900 17px var(--f-display);margin-bottom:4px}
.ex.no .tag{color:var(--no)} .ex.si .tag{color:var(--si)}
.ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.ex.no .ico{background:var(--no);color:var(--no-bg)} .ex.si .ico{background:var(--si);color:var(--si-bg)}
.ico svg{width:16px;height:16px}
.q{font:700 20px/1.45 var(--f-display)}
.ex.no .q span{background-image:linear-gradient(var(--no),var(--no));background-repeat:no-repeat;background-position:0 58%;background-size:100% 2px}
.who{font-size:15px;color:var(--soft);font-weight:600;margin-bottom:6px}
@media (prefers-reduced-motion:no-preference){
  .screen.enter .ex.no .q span{animation:strike .7s .45s ease both}
  @keyframes strike{from{background-size:0 2px}to{background-size:100% 2px}}
  .screen.enter .ex.si .ico svg path{stroke-dasharray:30;animation:draw .5s .7s ease both}
  @keyframes draw{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
}
.why{border-top:1px solid var(--gold);padding-top:18px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:baseline}
.why b{font:900 15px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink)}
.why p{font-size:20px;line-height:1.5}

.pager{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--gold);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.pager-in{max-width:900px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.prog{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.prog .n{font:800 16px var(--f-display);color:var(--soft);font-variant-numeric:tabular-nums}
.track{width:100%;max-width:260px;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--gold);transition:width .3s}
.jump{max-width:280px;padding:8px 12px;font-size:16px}
@media (max-width:520px){.pager .btn .lbl{display:none}.pager .btn{padding-inline:16px}}

.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:52px 1fr;gap:4px 16px;padding:18px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .num{width:44px;height:44px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font:900 19px var(--f-display);color:var(--gold-ink);grid-row:span 2}
.step h3{font-size:21px}
.step p{color:var(--soft)}
.step .eg{color:var(--ink);font-weight:500;border-left:2px solid var(--gold);padding-left:14px;margin-top:6px}

.states{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.st{border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.st.on{border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine)}
.st b{font:900 21px var(--f-display)}
.st p{color:var(--soft);font-size:17px}

.sem{display:flex;flex-direction:column}
.sem details{border-top:1px solid var(--line)}
.sem details:last-child{border-bottom:1px solid var(--line)}
.sem summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px 16px;align-items:center;padding:16px 4px}
.sem summary::-webkit-details-marker{display:none}
.dot{width:16px;height:16px;border-radius:50%}
.dot.si{background:var(--si)} .dot.amb{background:var(--amb)} .dot.no{background:var(--no)}
.sem summary b{font:800 19px/1.3 var(--f-display)}
.sem .body{padding:0 4px 20px 36px;display:flex;flex-direction:column;gap:10px}
.sem .hk{font:700 19px/1.45 var(--f-display)}
.fix{border-left:2px solid var(--gold);padding-left:14px}

.stepper{display:flex;align-items:center;gap:0;overflow-x:auto;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.sp{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 4px;cursor:pointer;font:800 17px var(--f-display);color:var(--soft);white-space:nowrap}
.sp i{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-style:normal;color:var(--gold-ink)}
.sp[aria-current="step"]{color:var(--ink)}
.sp[aria-current="step"] i{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.sp.done i{background:var(--si-bg);border-color:transparent;color:var(--si)}
.sp-line{width:28px;height:1px;background:var(--gold);flex:none;margin-inline:6px}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:22px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font:800 18px var(--f-display);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fld>em{font-style:normal;color:var(--soft);font-size:16px}
.req{font:800 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0;font-size:18px}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
textarea{resize:vertical;line-height:1.5}
.wide{grid-column:1/-1}
.group{display:flex;flex-direction:column;gap:18px;padding-top:22px;border-top:1px solid var(--line)}
.group>h3{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.group>h3 small{font:500 17px var(--f-body);color:var(--soft)}
.meter{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.meter .bar2{flex:1;min-width:160px;max-width:320px;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.meter .bar2 i{display:block;height:100%;background:var(--pine);border-radius:8px;transition:width .3s}
.banner{border:1px dashed var(--gold);border-radius:var(--r);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.opt:hover{border-color:var(--gold)}
.opt[aria-pressed="true"]{border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine);background:var(--pine-tint)}
.opt b{font:900 20px/1.3 var(--f-display)}
.opt span{color:var(--soft);font-size:16px}
.opt .k{font:800 15px var(--f-display);color:var(--gold-ink)}
.opt .idea{font:800 21px/1.35 var(--f-display);color:var(--ink)}

.ad{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:20px}
.ad-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.ad-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:24px;align-items:start}
@media (max-width:780px){.ad-grid{grid-template-columns:minmax(0,1fr)}}
.twenty{border:1px solid var(--gold);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.beats{display:flex;flex-direction:column}
.beat{display:grid;grid-template-columns:160px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-top:1px solid var(--line)}
.beat:first-child{border-top:0}
.beat b{font:800 16px var(--f-display);color:var(--gold-ink)}
@media (max-width:560px){.beat{grid-template-columns:1fr}}
.feed{background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden;width:100%}
.feed-h{display:flex;gap:10px;align-items:center;padding:12px 14px}
.av{width:38px;height:38px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font:900 17px var(--f-display);flex:none}
.feed-h b{display:block;font-size:16px;line-height:1.2}
.feed-h small{color:var(--soft);font-size:15px}
.feed-t{padding:0 14px 12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.5}
.cut{text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:4px}
.more{color:var(--soft)} .rest{opacity:.4}
.feed-m{width:100%;max-width:100%;height:150px;display:grid;place-items:center;text-align:center;padding:16px;color:var(--soft);font-size:15px;border-block:1px solid var(--line)}
.feed-f{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px 14px}
.feed-f b{font-size:16px;overflow-wrap:anywhere;min-width:0}
.fbtn{border:1px solid var(--line);padding:6px 12px;border-radius:8px;font-size:15px;font-weight:700;white-space:nowrap}
.checks{display:flex;flex-direction:column;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:17px}
.check .chip{flex:none}
.epic{display:flex;gap:8px;flex-wrap:wrap}

.score{display:flex;align-items:center;gap:12px}
.score svg{width:64px;height:64px;transform:rotate(-90deg)}
.score .lbl b{display:block;font:900 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.score .lbl span{font-size:15px;color:var(--soft)}
.ring-bg{stroke:var(--line)} .ring.si{stroke:var(--si)} .ring.amb{stroke:var(--amb)} .ring.no{stroke:var(--no)}

.empty{border:1px dashed var(--gold);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.note{border-left:2px solid var(--gold);padding:4px 0 4px 16px;color:var(--soft)}
.note b{color:var(--ink)}
.msg{max-width:900px;margin:16px auto 0;padding:14px 18px;border-radius:12px;background:var(--no-bg);color:var(--no);font-weight:600}
.busy{max-width:900px;margin:16px auto 0;padding:14px 18px;border-radius:12px;background:var(--pine-tint);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.tile{padding:18px 16px;display:flex;flex-direction:column;gap:4px}
.tile b{font:800 15px var(--f-display);color:var(--soft)}
.tile span{font:900 30px var(--f-display);font-variant-numeric:tabular-nums}
.tile.key span{color:var(--pine)}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:120px 1fr;gap:6px 18px;padding:18px 0;border-top:1px solid var(--line)}
.tl:first-child{border-top:0}
.tl b{font:900 18px var(--f-display);color:var(--gold-ink)}
@media (max-width:520px){.tl{grid-template-columns:1fr}}
.table{overflow-x:auto}
.table table{border-collapse:collapse;width:100%;min-width:560px}
.table th,.table td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:17px}
.table th{font:800 15px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink);border-bottom-color:var(--gold)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:9}
</style>

<div class="bar"><div class="bar-in">
  <div class="brand"><b><span class="mark" aria-hidden="true"><i></i></span>Anuncios que Agendan</b><span id="saved" class="saved" aria-live="polite"></span></div>

<div id="busy" class="busy" hidden></div>
<div id="msg" class="msg" hidden role="alert"></div>
<main id="view" class="wrap"></main>
<div class="pager" id="pager"></div>
<div id="toast" class="toast" hidden></div>

  '2. Espejo: lo que la mayoría hace mal, en conducta concreta, para que el lector concluya solo que es él. Nunca decirle que se equivoca.',

  '9. El avance es un LOGRO que pasó ("corriste publicidad"), nunca un estado ("ya tienes tu método").',

}

function setSaved(t){saveNote=t;var e=$('#saved');if(e)e.textContent=t}
function saveSoon(c){c.t=Date.now();clearTimeout(timers[c.id]);setSaved('Guardando…');timers[c.id]=setTimeout(function(){flush(c)},700)}
function flush(c){
  if(!c)return Promise.resolve();
  clearTimeout(timers[c.id]);
  if(store.mode==='db')return store.coll.doc(c.id).set(JSON.parse(JSON.stringify(c))).then(function(){setSaved('Guardado')},function(){setSaved('No se pudo guardar')});
  try{localStorage.setItem('aa3_clients',JSON.stringify(clients));setSaved('Guardado en este navegador')}catch(e){setSaved('')}
  return Promise.resolve();
}
async function initStore(){
  try{
    if(window.claude&&window.claude.use){
      var db=await window.claude.use('db'),user=await window.claude.use('user');
      var id=user?await user.id():null;
      if(db&&id){
        store.coll=db.collection('data/users/'+id+'/clientes');
        var snap=await store.coll.get();
        clients=snap.docs.map(function(d){return Object.assign(blank(),JSON.parse(JSON.stringify(d.data())),{id:d.id})});
        store.mode='db';return;
      }
    }
  }catch(e){}
  try{clients=(JSON.parse(localStorage.getItem('aa3_clients')||'[]')).map(function(c){return Object.assign(blank(),c)})}catch(e){clients=[]}
}

function lint(c,lineas,titular){
  var t=lineas.join('\n'),l1=lineas[0]||'',o=[],alto=!c||c.oferta===OFERTAS[0];
  var add=function(k,x){o.push({k:k,x:x})};
  if(!l1.trim()){add('amb','Todavía no hay texto.');return o}
  if(l1.length>125)add('no','El gancho tiene '+l1.length+' caracteres y Meta lo corta a los 125.');else add('si','El gancho entra entero en lo que se ve ('+l1.length+' de 125).');
  if((titular||'').length>40)add('no','El titular tiene '+titular.length+' caracteres. Máximo 40.');else if(titular)add('si','Titular de '+titular.length+' caracteres.');
  if(/te gustar[ií]a|quer[eé]s (ganar|tener|lograr)|quieres (ganar|tener|lograr)/i.test(t))add('no','Parte del deseo (“¿te gustaría…?”). Usa lo que ya hizo.');
  if(/te cuento|te voy a contar|nadie te dice|nadie te cuenta|qu[eé]date hasta|hasta el final/i.test(t))add('no','Gancho anunciado. Arranca directo con el dato.');
  if(/\bgente\b/i.test(t))add('no','Dice “gente”. Usa “personas” o “consultantes”.');
  if(/no me alcanza|no te alcanza|fin de mes|cuenta vac[ií]a|sin plata|sin dinero|falta de (plata|dinero)/i.test(t))add('no','Señal de pobreza: atrae a quien no puede pagar.');
  if(alto&&/\$\s?\d|\d[\d.,]*\s?(usd|d[oó]lares|euros|pesos)\b/i.test(t))add('amb','Menciona precio o plata. En alto valor, el precio vive en la página.');
  if(/descuento|% ?off|\d+ ?% de/i.test(t))add('no','Habla de descuento: baja el valor.');
  if(/¿est[aá]s (agotad|deprimid|cansad|estresad|ansios|quemad)|tu ansiedad|tu depresi/i.test(t))add('no','Le afirma una condición personal. Meta lo frena: usa hechos.');
  if(/garantiz|te curamos|100 ?% efectiv|antes y despu[eé]s/i.test(t))add('no','Promesa garantizada o antes y después. Meta lo rechaza.');
  if(/\bno es (un|una|otro|otra)\b/i.test(t))add('amb','Define por lo que no es. Dilo en positivo.');
  if(/\p{Extended_Pictographic}/u.test(t))add('amb','Tiene emojis.');
  if(/^\s*([-•*]|\d+[.)])\s/m.test(t))add('amb','Tiene una lista. Pásala a una sola idea.');
  if(t.length>500)add('amb','Son '+t.length+' caracteres: los textos largos traen curiosos.');
  if(/\[DATO REAL/i.test(t))add('amb','Faltan datos reales entre corchetes.');
  return o;
}

document.addEventListener('click',function(e){

  if(e.target.closest('textarea'))return;
  var c=cur();
  if(t.dataset.tab){go(t.dataset.tab);return}
  if(t.dataset.go){go(t.dataset.go);return}

  if(t.dataset.crear){flush(c);page.crear=+t.dataset.crear;showMsg('');render();return}
  var a=t.dataset.act,i=+t.dataset.i;
  if(a==='prev')return turn(-1);
  if(a==='next')return turn(1);
  if(a==='sino-last'){page.sino=sinoScreens()-1;render();return}
  if(a==='stop'){busy&&busy.ctl.abort();return}
  if(a==='use-plant'){if(c.plantillas.indexOf(t.dataset.id)<0){if(c.plantillas.length>=3)c.plantillas.shift();c.plantillas.push(t.dataset.id)}saveSoon(c);tab='crear';page.crear=2;render();return}
  if(a==='pick'){var k=c.plantillas.indexOf(t.dataset.id);if(k>-1)c.plantillas.splice(k,1);else if(c.plantillas.length<3)c.plantillas.push(t.dataset.id);else{showMsg('Son tres como máximo: más anuncios reparten la plata y Meta no aprende.');return}showMsg('');saveSoon(c);render(true);return}
  if(a==='rm20'){e.stopPropagation();c.veintes=c.veintes.filter(function(v){return v.id!==t.dataset.id});c.sel20=c.sel20.filter(function(x){return x!==t.dataset.id});saveSoon(c);render(true);return}
  if(a==='pick20'){var j=c.sel20.indexOf(t.dataset.id);if(j>-1)c.sel20.splice(j,1);else if(c.sel20.length<3)c.sel20.push(t.dataset.id);else{showMsg('Elige hasta tres ideas.');return}showMsg('');saveSoon(c);render(true);return}
  if(a==='add20'){var v={id:uid(),t:'',de:'Escrita a mano',por:'',edit:true};c.veintes.unshift(v);if(c.sel20.length<3)c.sel20.push(v.id);saveSoon(c);render(true);var ta=document.querySelector('[data-v20="'+v.id+'"]');if(ta)ta.focus();return}
  if(a==='gen20')return gen20();
  if(a==='gen'){page.crear=3;render();return genAds()}
  if(a==='rev')return genRev();
  if(a==='new'){var n=blank();clients.push(n);curId=n.id;flush(n);page.crear=0;tab='crear';render();return}
  if(a==='del'){
    if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Toca otra vez para eliminar';return}
    var id=c.id;clients=clients.filter(function(x){return x.id!==id});
    if(store.mode==='db')store.coll.doc(id).delete().catch(function(){});
    if(!clients.length)clients.push(demo());
    curId=clients[0].id;flush(clients[0]);render();return}
  if(a==='rmad'){c.anuncios.splice(i,1);saveSoon(c);render(true);return}
  if(a==='copy'){var ad=c.anuncios[i];copy(t.dataset.k==='texto'?ad.lineas.join('\n')+'\n\nTitular: '+ad.titular:ad.beats.map(function(b){return b[0]+': '+b[1]}).join('\n'));return}
  if(a==='torev'){var ad2=c.anuncios[i];c.rev={texto:ad2.lineas.join('\n'),titular:ad2.titular,res:null};saveSoon(c);go('revisar');return}
  if(a==='copy-rew'){copy(c.rev.res.reescritura.lineas.join('\n'));return}
  if(a==='userew'){c.rev.texto=c.rev.res.reescritura.lineas.join('\n');if(c.rev.res.reescritura.titular)c.rev.titular=c.rev.res.reescritura.titular;c.rev.res=null;saveSoon(c);render(true);return}

});

document.addEventListener('input',function(e){
  var t=e.target,c=cur();if(!c)return;
  if(t.dataset.f){c[t.dataset.f]=t.value;if(t.dataset.f==='nombre'){c.ejemplo=false;var o=$('#sel option:checked');if(o)o.textContent=t.value||'Cliente sin nombre'}var m=$('.meter');if(m)m.outerHTML=meterHTML(c);saveSoon(c);return}
  if(t.dataset.v20){var v=c.veintes.find(function(x){return x.id===t.dataset.v20});if(v)v.t=t.value;saveSoon(c);return}
  if(t.dataset.ad!==undefined){var i=+t.dataset.ad,a=c.anuncios[i];if(t.dataset.k==='texto')a.lineas=t.value.split('\n');else a[t.dataset.k]=t.value;$('#live-'+i).innerHTML=liveAd(c,a);saveSoon(c);return}
  if(t.dataset.rev){c.rev[t.dataset.rev]=t.value;var l=S(c.rev.texto).split('\n').filter(function(x){return x.trim()});$('#rv-live').innerHTML=l.length?liveAd(c,{lineas:l,titular:c.rev.titular}):'';saveSoon(c);return}
  if(t.dataset.plan){c.plan[t.dataset.plan]=t.value;$('#calc').innerHTML=calcHTML(c);saveSoon(c);return}
});
document.addEventListener('change',function(e){
  var t=e.target,c=cur();
  if(t.id==='sel'){flush(c);curId=t.value;showMsg('');render(true);return}
  if(t.id==='jump'){page.sino=+t.value;render();return}
  if(t.dataset&&t.dataset.f&&t.tagName==='SELECT'){c[t.dataset.f]=t.value;saveSoon(c);if(t.dataset.f==='destino')render(true);return}
});

(async function(){
  try{var st=localStorage.getItem('aa3_tab');if(st&&VIEWS[st])tab=st}catch(e){}
  clients=[demo()];curId=clients[0].id;render();
  await initStore();
  if(!clients.length){clients.push(demo())}
  curId=clients[0].id;render(true);
})();
})();
</script>
