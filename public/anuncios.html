<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anuncios que Agendan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,100&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Una pantalla = una acción. Barra de 4 pasos arriba, botón principal siempre visible abajo, letra grande. */
:root{
  --bg:#FAF8F3; --card:#FFFFFF; --surface:#F2EEE5; --ink:#1A1813; --muted:#5C5548; --line:#E3DDD0;
  --gold:#94702E; --gline:rgba(148,112,46,.42); --act:#1C3A2E; --act-ink:#FFFFFF; --act-soft:rgba(28,58,46,.08);
  --ok:#2E6B4F; --okbg:rgba(46,107,79,.10); --warn:#9A6212; --warnbg:rgba(154,98,18,.10); --bad:#B23A30; --badbg:rgba(178,58,48,.08);
  --g1:#94702E; --g1bg:rgba(148,112,46,.08); --g2:#2E6B4F; --g2bg:rgba(46,107,79,.08); --g3:#3D4A63; --g3bg:rgba(61,74,99,.07);
  --fs:"Fraunces",Georgia,"Times New Roman",serif; --fb:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --shadow:0 1px 2px rgba(26,24,19,.04),0 8px 24px rgba(26,24,19,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121311; --card:#191B18; --surface:#20231F; --ink:#EEEAE2; --muted:#ABA497; --line:#30332D;
  --gold:#CFAE6C; --gline:rgba(207,174,108,.45); --act:#3A7158; --act-ink:#F7F4EE; --act-soft:rgba(120,197,155,.10);
  --ok:#7CC79E; --okbg:rgba(124,199,158,.13); --warn:#E2B566; --warnbg:rgba(226,181,102,.13); --bad:#E8867D; --badbg:rgba(232,134,125,.13);
  --g1:#CFAE6C; --g1bg:rgba(207,174,108,.10); --g2:#7CC79E; --g2bg:rgba(124,199,158,.09); --g3:#A9B6D3; --g3bg:rgba(169,182,211,.09);
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121311; --card:#191B18; --surface:#20231F; --ink:#EEEAE2; --muted:#ABA497; --line:#30332D;
  --gold:#CFAE6C; --gline:rgba(207,174,108,.45); --act:#3A7158; --act-ink:#F7F4EE; --act-soft:rgba(120,197,155,.10);
  --ok:#7CC79E; --okbg:rgba(124,199,158,.13); --warn:#E2B566; --warnbg:rgba(226,181,102,.13); --bad:#E8867D; --badbg:rgba(232,134,125,.13);
  --g1:#CFAE6C; --g1bg:rgba(207,174,108,.10); --g2:#7CC79E; --g2bg:rgba(124,199,158,.09); --g3:#A9B6D3; --g3bg:rgba(169,182,211,.09);
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:500 18px/1.55 var(--fb);margin:0;min-height:100vh}
button{font:inherit;color:inherit}
svg{flex:none}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* ── cabecera y pasos ── */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:720px;margin:0 auto;padding:12px 16px 0}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-family:var(--fs);font-variation-settings:"SOFT" 100;font-weight:580;font-size:20px;letter-spacing:-.01em;line-height:1.15;white-space:nowrap}
.hlinks{display:flex;gap:6px}
.hl{background:none;border:1px solid var(--line);border-radius:99px;padding:7px 13px;white-space:nowrap;font-weight:700;font-size:16px;cursor:pointer;color:var(--muted);min-height:40px}
.hl.q{width:40px;padding:0;font-family:var(--fs);font-size:20px}
.hl[aria-current="true"]{color:var(--ink);border-color:var(--gold)}
ol.stepper{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);position:relative}
ol.stepper::before{content:"";position:absolute;left:12.5%;right:12.5%;top:19px;height:2px;background:var(--line)}
.stepper li{position:relative;display:flex;justify-content:center}
.stepper button{background:none;border:0;padding:0 2px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;width:100%;min-height:44px}
.dot{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;background:var(--bg);border:2px solid var(--line);color:var(--muted);position:relative;z-index:1;transition:background .25s,border-color .25s,color .25s}
.sl{font-weight:700;font-size:15px;letter-spacing:-.01em;color:var(--muted);white-space:nowrap}
.stepper .done .dot{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.stepper .cur .dot{background:var(--act);border-color:var(--act);color:var(--act-ink)}
.stepper .cur .sl{color:var(--ink)}
.stepper .cur button::after{content:"";position:absolute;bottom:0;left:22%;right:22%;height:3px;border-radius:3px;background:var(--gold)}

/* ── pantallas ── */
section.screen{padding:28px 0 32px;animation:enter .28s ease both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kick{font:800 15px var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0}
h1,h2,h3{font-family:var(--fs);font-variation-settings:"SOFT" 100;font-weight:560;letter-spacing:-.018em;text-wrap:balance;margin:8px 0 0}
h1{font-size:clamp(32px,8.4vw,46px);line-height:1.08}
h2{font-size:clamp(28px,7vw,36px);line-height:1.1}
h3{font-size:24px;line-height:1.2}
.lead{color:var(--muted);font-size:19px;margin:12px 0 0;max-width:56ch}
.note{color:var(--muted);font-size:17px;margin:10px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* ── botones ── */
.btn{appearance:none;border:0;border-radius:16px;background:var(--act);color:var(--act-ink);font:800 19px var(--fb);padding:16px 22px;cursor:pointer;min-height:58px;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.ghost{appearance:none;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:16px;font:700 18px var(--fb);padding:13px 18px;cursor:pointer;min-height:54px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.ghost[disabled]{opacity:.45;cursor:not-allowed}
.ghost.danger{color:var(--bad)}
.link{background:none;border:0;color:var(--gold);font-weight:800;font-size:17px;cursor:pointer;padding:10px 0;text-decoration:underline;text-underline-offset:4px}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:10px}
.dock{position:sticky;bottom:0;z-index:15;margin-top:26px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,rgba(0,0,0,0),var(--bg) 18px)}
.dock .in{display:flex;gap:10px;align-items:center}
.dock .in .btn{flex:1}
.dock .count{font-weight:800;font-size:17px;color:var(--muted);text-align:center;margin-bottom:8px}

/* ── método ── */
.rail{list-style:none;margin:26px 0 0;padding:0;position:relative}
.rail li{display:grid;grid-template-columns:46px 1fr;gap:14px;padding:10px 0;position:relative}
.rail li::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:2px;background:var(--line)}
.rail li.gh::before{display:none}.rail li:first-child::before{top:50%}.rail li:last-child::before{bottom:50%}
.num{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 18px var(--fb);position:relative;z-index:1;border:2px solid currentColor;background:var(--bg)}
.g1{color:var(--g1)}.g2{color:var(--g2)}.g3{color:var(--g3)}
.rail b{display:block;font-size:20px;color:var(--ink)}
.rail span.d{color:var(--muted);font-size:17px}
.grp{display:inline-block;font:800 15px var(--fb);letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border-radius:99px;margin:18px 0 4px}
.grp.g1{background:var(--g1bg)}.grp.g2{background:var(--g2bg)}.grp.g3{background:var(--g3bg)}
.ej{margin-top:26px;padding:22px 20px}
.ej .q{font-family:var(--fs);font-size:25px;line-height:1.28;font-variation-settings:"SOFT" 100;font-weight:520;margin:12px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-size:16px;font-weight:700;padding:6px 12px;border-radius:99px;background:var(--surface);color:var(--muted)}
details.more{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
details.more summary{cursor:pointer;list-style:none;padding:18px 20px;font-weight:800;font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:60px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-size:26px;color:var(--gold);font-weight:600}
details.more[open] summary::after{content:"–"}
details.more .body{padding:0 20px 18px;color:var(--muted)}
details.more .body li{margin-top:8px}
details.more .body a{color:var(--gold);font-weight:700}

/* ── formulario ── */
.pager{display:flex;gap:8px;margin-top:18px}
.pager span{flex:1;height:6px;border-radius:6px;background:var(--line);transition:background .3s}
.pager span.on{background:var(--gold)}
.field{margin-top:24px}
.field label{display:block;font-weight:800;font-size:20px;line-height:1.3}
.field .h{display:block;color:var(--muted);font-size:17px;margin-top:4px}
textarea,input[type=text]{width:100%;margin-top:10px;font:500 18px/1.5 var(--fb);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;resize:vertical;transition:border-color .2s}
textarea{min-height:110px}
textarea:focus,input[type=text]:focus{border-color:var(--gold);outline:none}
.field.err textarea,.field.err input{border-color:var(--bad)}
.ferr{display:none;color:var(--bad);font-weight:700;font-size:17px;margin-top:6px}
.field.err .ferr{display:block}
.banner{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--surface);font-size:17px;color:var(--muted)}

/* ── momentos ── */
.moms{display:grid;gap:12px;margin-top:22px}
.mcard{display:grid;grid-template-columns:34px 1fr;gap:14px;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px 16px;cursor:pointer;transition:border-color .2s,background .2s,transform .12s;box-shadow:var(--shadow)}
.mcard:active{transform:scale(.99)}
.mcard[aria-pressed="true"]{border-color:var(--act);background:var(--act-soft)}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;margin-top:2px;color:transparent;transition:all .2s}
.mcard[aria-pressed="true"] .tick{background:var(--act);border-color:var(--act);color:var(--act-ink)}
.mcard .rank{font:800 15px var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.mcard .esc{display:block;font-family:var(--fs);font-size:22px;line-height:1.3;font-variation-settings:"SOFT" 100;font-weight:540;margin-top:4px}
.mcard .why{display:block;margin-top:8px;color:var(--muted);font-size:17px}
.mcard .why b{color:var(--ink)}

/* ── progreso ── */
.prog{margin-top:22px;padding:22px 20px}
.prog .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prog .ph b{font-size:21px}
.prog .secs{font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.prog ul{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:4px}
.prog li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prog li:first-child{border-top:0}
.prog .st{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);color:var(--muted)}
.prog li.run .st{border-color:var(--gold);border-top-color:transparent;animation:spin 1s linear infinite}
.prog li.ok .st{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.prog li.warn .st{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
.prog li.err .st{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.prog .lbl{font-weight:800}
.prog .sub{display:block;color:var(--muted);font-size:16px;font-weight:600}
.prog li.wait .lbl{color:var(--muted)}
.prog .bar{height:8px;border-radius:8px;background:var(--surface);margin-top:16px;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:8px;transition:width .5s}
@keyframes spin{to{transform:rotate(360deg)}}
.errbox{margin-top:18px;padding:18px;border-radius:var(--r);background:var(--badbg);color:var(--bad);font-weight:700}
.errbox .row{margin-top:12px}
.msg{margin-top:12px;font-weight:700;color:var(--muted);min-height:1.4em}
.msg.bad{color:var(--bad)}

/* ── anuncios ── */
.adtabs{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px;margin-top:22px}
.adtab{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 4px;cursor:pointer;text-align:center;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.adtab b{font-size:18px;white-space:nowrap}
.adtab small{font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.adtab small.ok{color:var(--ok)}.adtab small.warn{color:var(--warn)}
.adtab[aria-selected="true"]{border-color:var(--act);background:var(--act-soft)}
.ad{margin-top:18px}
.screen-text{padding:24px 20px;border-radius:var(--r);background:var(--act);color:var(--act-ink);font-family:var(--fs);font-variation-settings:"SOFT" 100;font-weight:560;font-size:clamp(26px,7vw,34px);line-height:1.18;text-wrap:balance}
.screen-text small{display:block;font:800 15px var(--fb);letter-spacing:.16em;text-transform:uppercase;opacity:.8;margin-bottom:10px}
.quality{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px 16px;border-radius:16px;font-weight:800;cursor:pointer;width:100%;text-align:left;border:0}
.quality.ok{background:var(--okbg);color:var(--ok)}
.quality.warn{background:var(--warnbg);color:var(--warn)}
.quality .qi{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:currentColor}
.quality .qi svg{color:var(--card)}
.quality span.qt{flex:1}
.quality span.qt small{display:block;font-weight:600;font-size:16px;opacity:.9}
.cklist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.cklist li{display:flex;gap:10px;align-items:flex-start;font-size:17px;font-weight:600;padding:8px 12px;border-radius:12px}
.cklist li.ok{color:var(--ok);background:var(--okbg)}
.cklist li.no{color:var(--bad);background:var(--badbg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:18px;padding:4px;border-radius:16px;background:var(--surface)}
.seg button{background:none;border:0;border-radius:12px;padding:12px 6px;font-weight:800;font-size:17px;cursor:pointer;color:var(--muted);min-height:52px}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.parts{list-style:none;margin:18px 0 0;padding:0;position:relative}
.parts li{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:6px 0 10px;position:relative}
.parts li::before{content:"";position:absolute;left:19px;top:0;bottom:0;width:2px;background:var(--line)}
.parts li:first-child::before{top:22px}.parts li:last-child::before{bottom:calc(100% - 22px)}
.parts .num{width:40px;height:40px;font-size:16px}
.parts .pl{font:800 15px var(--fb);letter-spacing:.12em;text-transform:uppercase;margin-top:9px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.parts .same{font-size:15px;letter-spacing:.06em;color:var(--muted);background:var(--surface);padding:2px 8px;border-radius:99px}
.parts .pt{margin-top:6px;padding:14px 16px;border-radius:14px;font-size:19px;line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
.parts li.g1 .pt{background:var(--g1bg)}.parts li.g2 .pt{background:var(--g2bg)}.parts li.g3 .pt{background:var(--g3bg)}
.parts li.first .pt{font-family:var(--fs);font-size:23px;line-height:1.3;font-variation-settings:"SOFT" 100;font-weight:540}
.meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-weight:700;font-size:17px}
.meta span{display:inline-flex;gap:6px;align-items:center}
.box{margin-top:16px;padding:18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line)}
.box .bl{display:flex;justify-content:space-between;align-items:center;gap:10px}
.box .bl b{font:800 15px var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.box .bt{margin-top:10px;white-space:pre-wrap;font-size:19px;overflow-wrap:anywhere}
.copy{appearance:none;background:var(--surface);border:0;border-radius:12px;font:800 16px var(--fb);padding:10px 14px;cursor:pointer;min-height:44px;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.copy.done{background:var(--okbg);color:var(--ok)}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.rowbtns > *{flex:1 1 200px}
.empty{margin-top:22px;padding:26px 22px;border:2px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:18px}
.empty .btn{margin-top:16px}

/* ── VSL ── */
.vsec{margin-top:12px}
.vsec summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:16px;min-height:72px}
.vsec summary::-webkit-details-marker{display:none}
.vsec .vt b{display:block;font-size:19px}
.vsec .vt span{color:var(--muted);font-size:16px;font-weight:700}
.vsec .chev{color:var(--gold);transition:transform .2s}
.vsec[open] .chev{transform:rotate(180deg)}
.vsec .vb{padding:0 16px 16px}
.vsec .vb .bt{white-space:pre-wrap;font-size:19px;padding:16px;border-radius:14px;background:var(--surface);overflow-wrap:anywhere}
.verd{margin-top:22px;font-family:var(--fs);font-size:25px;line-height:1.3;font-variation-settings:"SOFT" 100}
@media (min-width:700px){.rail li{grid-template-columns:46px 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brandrow">
    <button class="brand" type="button" data-nav="metodo">Anuncios que Agendan</button>
    <div class="hlinks"><button class="hl q" type="button" data-nav="metodo" id="hl-metodo" aria-label="Cómo funciona el método">?</button><button class="hl" type="button" data-nav="revisar" id="hl-revisar">Revisar</button></div>
  </div>
  <ol class="stepper" aria-label="Pasos">
    <li id="st-cliente"><button type="button" data-nav="cliente"><span class="dot">1</span><span class="sl">Cliente</span></button></li>
    <li id="st-momentos"><button type="button" data-nav="momentos"><span class="dot">2</span><span class="sl">Momentos</span></button></li>
    <li id="st-anuncios"><button type="button" data-nav="anuncios"><span class="dot">3</span><span class="sl">Anuncios</span></button></li>
    <li id="st-vsl"><button type="button" data-nav="vsl"><span class="dot">4</span><span class="sl">VSL</span></button></li>
  </ol>
</div></header>

<main class="wrap" id="main"></main>

<script>
(function(){
"use strict";

/* ═════════ utilidades ═════════ */
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function words(s){return String(s||"").trim().split(/\s+/).filter(Boolean).length}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
var ICO={

  return VS.slice(from,to).map(function(x,i){var s=arr[i]||{};return {id:from+i+1,parte:x.parte,texto:clean(s.texto||"").replace(/\n{3,}/g,"\n\n")}})}
function checksHalf(secs,from){var b=state.brief,all=secs.map(function(s){return s.texto}).join("\n"),L=[];
  secs.forEach(function(s,i){var x=VS[from+i],w=words(s.texto);L.push({ok:w>=Math.round(x.min*.75)&&w<=Math.round(x.max*1.3),t:x.parte+": "+w+" palabras",fix:"«"+x.parte+"» tiene "+w+" palabras: déjala entre "+x.min+" y "+x.max+"."})});
  if(from>0){if(b.escasez)L.push({ok:escasezOk(secs[2].texto)&&escasezOk(secs[3].texto),t:"Escasez exacta",fix:"«Para quién es» y «Llamado a la acción» tienen que decir la escasez exacta del brief: «"+b.escasez+"»."});
    L.push({ok:/calendario|agenda/i.test(secs[3].texto),t:"Lleva al calendario",fix:"El llamado a la acción tiene que nombrar el calendario debajo del video."})}
  return L.concat(commonChecks(all,false))}
async function writeHalf(from,to,si,prev){
  step(si,"run","Escribiendo");
  var p="Escribe "+(from===0?"la PRIMERA":"la SEGUNDA")+" mitad del guion de un VSL: video de venta a cámara, unos 8 minutos en total, para una oferta high ticket que lleva a agendar un diagnóstico 1 a 1 sin costo.\n\n"+
   (prev?"PRIMERA MITAD YA ESCRITA (sigue desde ahí, sin repetirla):\n"+prev.map(function(s){return s.parte.toUpperCase()+"\n"+s.texto}).join("\n\n")+"\n\n":"")+
   "PARTES QUE ESCRIBES, en este orden:\n"+vslSpec(from,to)+"\n\n"+vslBase()+"\n\n"+
   "Párrafos cortos separados por línea en blanco. Responde SOLO con JSON: {\"secciones\":["+VS.slice(from,to).map(function(x){return "{\"parte\":\""+x.parte+"\",\"texto\":\"\"}"}).join(",")+"]}";
  var s=normSecs(await ai(p),from,to);
  var f=fails(checksHalf(s,from));
  if(f.length){step(si,"run","Corrigiendo: "+f[0].t.toLowerCase());
    var s2=normSecs(await ai(repairPrompt("una mitad del guion de un VSL",{secciones:s.map(function(x){return {parte:x.parte,texto:x.texto}})},f)),from,to);
    if(fails(checksHalf(s2,from)).length<=f.length&&s2.every(function(x){return x.texto}))s=s2}
  var nf=fails(checksHalf(s,from)).length;step(si,nf?"warn":"ok",nf?"Lista, con "+nf+" detalle para revisar":"Lista y revisada");return s}
async function hacerVsl(){if(RUN)return;
  if(!briefOk()){state.page=0;go("cliente");return}
  go("vsl");
  if(!startRun("runbox","Escribiendo tu VSL",["Primera mitad: apertura, quién soy, obstáculo y camino","Segunda mitad: prueba, garantía, para quién es y llamado"]))return;
  try{var a=await writeHalf(0,4,0,null);var b=await writeHalf(4,8,1,a);
    state.vsl=a.concat(b);state.ejemplo=false;save();await sleep(400);endRun();go("vsl")}
  catch(e){endRun();go("vsl");showErr("errbox",e,hacerVsl)}}
function vVsl(s){var V=state.vsl,ck=V.length?checksVsl(V):[],f=fails(ck),acc=0;CLIP={};
  s.innerHTML='<p class="kick">Paso 4</p><h2>Tu VSL, con la misma estructura</h2>'+
   '<p class="lead">Arranca con el avance y el obstáculo, nombra el obstáculo real, muestra el camino, filtra a quién es y cierra en el diagnóstico. Unos 8 minutos.</p>'+
   '<div id="runbox"></div><div id="errbox"></div><div id="vbox"></div>'+
   '<div class="dock"><div class="in">'+(V.length?copyBtn("vall",V.map(function(x){return x.parte.toUpperCase()+"\n"+x.texto}).join("\n\n"),"Copiar todo").replace('class="copy"','class="ghost"'):"")+
   '<button class="btn" type="button" id="mkvsl" data-run>'+(V.length?ICO.redo+" Rehacer":"Escribir el VSL "+ICO.arrow)+'</button></div></div>';
  var box=$("vbox");
  if(!V.length){if(!RUN)box.innerHTML='<div class="empty">Usa el cliente del paso 1 y los momentos del paso 2. Para un VSL más fuerte, completa «Tu historia» y «Cómo trabajan y tu garantía» en el paso 1.</div>'}
  else{var w=V.reduce(function(n,x){return n+words(x.texto)},0);
    box.innerHTML='<button class="quality '+(f.length?"warn":"ok")+'" type="button" data-toggle="ck-vsl"><span class="qi">'+(f.length?ICO.warn:ICO.check)+'</span><span class="qt">'+(f.length?"Revisa "+f.length+" detalle"+(f.length>1?"s":""):"Estructura completa y revisada")+'<small>'+w+' palabras · unos '+Math.round(w/140)+' minutos'+(state.ejemplo?" · ejemplo":"")+'</small></span></button>'+
     '<ul class="cklist" id="ck-vsl" hidden>'+ck.map(function(c){return '<li class="'+(c.ok?"ok":"no")+'">'+(c.ok?ICO.check:ICO.x)+'<span>'+esc(c.t)+'</span></li>'}).join("")+'</ul>'+
     V.map(function(x,i){var t0=acc;acc+=words(x.texto);var mm=Math.floor(t0/140),ss=Math.round((t0/140-mm)*60);
      return '<details class="card vsec"'+(i===0?" open":"")+'><summary><span class="num g'+(i<3?1:i<6?2:3)+'">'+(i+1)+'</span><span class="vt"><b>'+esc(x.parte)+'</b><span>Desde el minuto '+mm+':'+(ss<10?"0":"")+ss+' · '+words(x.texto)+' palabras</span></span><span class="chev">'+ICO.chev+'</span></summary><div class="vb"><div class="bt">'+esc(x.texto)+'</div><div class="rowbtns">'+copyBtn("v"+i,x.texto)+'</div></div></details>'}).join("")}
  $("mkvsl").addEventListener("click",hacerVsl)}

/* ═════════ revisar uno ═════════ */
var REV=null;
function vRevisar(s){s.innerHTML='<p class="kick">Antes de gastar en pauta</p><h2>Revisa un anuncio que ya tienes</h2>'+
   '<p class="lead">Pega el guion o el texto. Te digo qué parte de la estructura falta y te lo devuelvo reescrito con las 10 partes. Usa el cliente del paso 1.</p>'+
   '<div class="field"><label for="r-texto">Tu anuncio</label><textarea id="r-texto" style="min-height:190px" placeholder="Pega aquí el guion o el texto del anuncio"></textarea><span class="ferr">Pega un anuncio primero.</span></div>'+
   '<div id="runbox"></div><div id="errbox"></div><div id="revbox"></div>'+
   '<div class="dock"><div class="in"><button class="btn" type="button" id="rev" data-run>Revisar y reescribir '+ICO.arrow+'</button></div></div>';
  var ta=$("r-texto");ta.value=(REV&&REV.src)||"";ta.addEventListener("input",function(){ta.parentNode.classList.remove("err")});
  $("rev").addEventListener("click",revisar);drawRevision()}
function drawRevision(){var box=$("revbox");if(!box||!REV||!REV.res)return;var r=REV.res;CLIP={};
  box.innerHTML='<p class="verd">'+esc(r.veredicto)+'</p><ul class="cklist" style="margin-top:14px">'+(r.puntos||[]).map(function(x){return '<li class="'+(x.cumple?"ok":"no")+'">'+(x.cumple?ICO.check:ICO.x)+'<span><b>'+esc(x.parte)+':</b> '+esc(x.por_que)+'</span></li>'}).join("")+'</ul>'+
   (REV.ad?'<h3 style="margin-top:30px">Reescrito con las 10 partes</h3><div class="ad">'+adHTML(REV.ad,"r",false)+'</div>':"")}
async function revisar(){if(RUN)return;var t=$("r-texto").value.trim();if(!t){$("r-texto").parentNode.classList.add("err");$("r-texto").focus();return}
  if(!briefOk()){state.page=0;go("cliente");return}
  REV={src:t,res:null,ad:null};$("revbox").innerHTML="";
  if(!startRun("runbox","Revisando tu anuncio",["Leer tu anuncio contra las 10 partes","Cierre común","Reescribir con un momento"]))return;
  try{step(0,"run","");
    var p="Revisa este anuncio en frío de Meta contra la estructura de 10 partes que agenda: 1 avance (elogio que califica), 2 obstáculo, 3 error principal, 4 solución real, 5 autoridad, 6 sistema, 7 llamado al video, 8 exclusividad, 9 escasez, 10 llamado final. El gancho junta avance y obstáculo en la primera frase. Lo que trae curiosos: dolor o miseria, explicar el método, la historia del vendedor, testimonios, listas largas.\n\n"+
     "REGLAS:\n"+REGLAS+"\n\nBRIEF:\n"+briefTxt(state.brief)+"\n\nANUNCIO A REVISAR:\n"+t.slice(0,6000)+"\n\n"+
     "Responde SOLO con JSON: {\"veredicto\":\"una frase directa: si va a traer clientes que invierten o curiosos, y por qué\",\"puntos\":[{\"parte\":\"nombre de la parte\",\"cumple\":true,\"por_que\":\"una frase\"}],\"momento\":{\"escena\":\"el mejor momento para reescribirlo: avance + obstáculo en una frase de máximo 110 caracteres, en segunda persona\",\"siente\":\"\",\"creencia\":\"\",\"verdad\":\"\"}} con un punto por cada una de las 10 partes.";
    var r=await ai(p);r=r||{};REV.res={veredicto:clean(r.veredicto),puntos:(Array.isArray(r.puntos)?r.puntos:[]).map(function(x){return {parte:clean(x.parte),cumple:!!x.cumple,por_que:clean(x.por_que)}})};step(0,"ok","");
    var m=r.momento&&r.momento.escena?{escena:clean(r.momento.escena),siente:clean(r.momento.siente),creencia:clean(r.momento.creencia),verdad:clean(r.momento.verdad)}:{escena:t.slice(0,140),siente:"",creencia:"",verdad:""};
    var c=await makeCierre(1);REV.ad=await writeAd(m,c,[],2);await sleep(400);endRun();state.view="grabar";go("revisar")}
  catch(e){endRun();go("revisar");showErr("errbox",e,revisar)}}

render();
